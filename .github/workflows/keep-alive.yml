name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -sSL -c cookies.txt -b cookies.txt -o /dev/null -w "HTTP status: %{http_code}\n" "https://sl-airbnb-dashboard.streamlit.app/" || echo "Ping failed, but not blocking the workflow"