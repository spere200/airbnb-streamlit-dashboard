name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (at minute 0 of hours 0, 6, 12, 18 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # lets you manually trigger it from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit Streamlit app with a real browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          url = 'https://sl-airbnb-dashboard.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=60000)
              page.wait_for_timeout(5000)  # let the app fully load / establish session

              # If the app is asleep, click the wake-up button
              try:
                  wake_button = page.get_by_text('get this app back up', exact=False)
                  if wake_button.is_visible(timeout=3000):
                      wake_button.click()
                      page.wait_for_timeout(10000)
                      print('App was asleep — clicked wake button')
              except Exception:
                  print('App was already awake, no wake button found')

              print('Visited app successfully')
              browser.close()
          "
